# Builds the Android app (a Trusted Web Activity for https://study.rekhank.app) and publishes the APK
# as the "android" release, so the latest build is always at releases/latest/download/CoachYourWard.apk.
name: Android app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build signed APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk CoachYourWard.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CoachYourWard-apk
          path: CoachYourWard.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: CoachYourWard for Android (build ${{ github.run_number }})
          body: Install CoachYourWard.apk on an Android phone. It opens study.rekhank.app full screen; sign-in and progress sync work as on the website.
          files: CoachYourWard.apk
          make_latest: true
