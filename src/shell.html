<title>CoachYourWard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#2347c5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: fixed left rail (exam-hall register), content column ≤ 920px; rail becomes a top scroller on phones. */
:root {
  --paper: #f4f6fa;
  --surface: #ffffff;
  --ink: #172036;
  --muted: #5a6478;
  --line: #dde2ec;
  --accent: #2347c5;      /* fountain-pen blue */
  --accent-soft: #e6ecfc;
  --hot: #c46a00;         /* marigold, Hot Section only */
  --hot-soft: #fff1dc;
  --good: #1f8a5b; --good-soft: #e1f4ea;
  --warn: #b7791f; --bad: #c2413a; --bad-soft: #fbe6e4;
  --maths: #2347c5; --science: #1f8a5b; --english: #8a3fb0; --sanskrit: #b4441b; --social: #0f7c8c;
  --rail: #172036; --rail-ink: #c9d2e6; --rail-active: #ffffff;
  --display: "Bricolage Grotesque", "Noto Sans Devanagari", "Segoe UI", system-ui, sans-serif;
  --body: "Source Sans 3", "Noto Sans Devanagari", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", "Noto Sans Devanagari", ui-monospace, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0f1420; --surface: #171e2d; --ink: #e6eaf2; --muted: #9aa4b8; --line: #2a3346;
  --accent: #8ba2ff; --accent-soft: #1e2a4d; --hot: #f0a83a; --hot-soft: #3a2a12;
  --good: #4cc38a; --good-soft: #15342a; --warn: #e0a945; --bad: #f07a72; --bad-soft: #3d1f1d;
  --maths: #8ba2ff; --science: #4cc38a; --english: #c48be0; --sanskrit: #f08a5d; --social: #4cc9d8;
  --rail: #0a0e17; --rail-ink: #9aa4b8; --rail-active: #ffffff; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #0f1420; --surface: #171e2d; --ink: #e6eaf2; --muted: #9aa4b8; --line: #2a3346;
  --accent: #8ba2ff; --accent-soft: #1e2a4d; --hot: #f0a83a; --hot-soft: #3a2a12;
  --good: #4cc38a; --good-soft: #15342a; --warn: #e0a945; --bad: #f07a72; --bad-soft: #3d1f1d;
  --maths: #8ba2ff; --science: #4cc38a; --english: #c48be0; --sanskrit: #f08a5d; --social: #4cc9d8;
  --rail: #0a0e17; --rail-ink: #9aa4b8; --rail-active: #ffffff; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55; }
h1, h2, h3 { font-family: var(--display); line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: 1.9rem; font-weight: 700; }
h2 { font-size: 1.3rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.label { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

.app { display: grid; grid-template-columns: 240px 1fr; min-height: 100%; }
.rail { background: var(--rail); color: var(--rail-ink); padding: 24px 14px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 22px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 1.25rem; color: var(--rail-active); padding: 0 10px; }
.brand small { display: block; font-family: var(--body); font-weight: 400; font-size: .8rem; color: var(--rail-ink); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { background: none; border: 0; text-align: left; padding: 9px 12px; border-radius: 8px; color: var(--rail-ink); display: flex; align-items: center; gap: 10px; font-weight: 600; }
.nav button:hover { background: rgba(255,255,255,.06); color: var(--rail-active); }
.nav button[aria-current="page"] { background: rgba(255,255,255,.1); color: var(--rail-active); }
.nav .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; opacity: .5; flex: none; }
.nav button[data-page="hot"] .dot { background: var(--hot); opacity: 1; }
.nav-sep { height: 1px; background: rgba(255,255,255,.08); margin: 8px 10px; }
.rail-foot { margin-top: auto; font-size: .78rem; padding: 0 10px; }

.main { min-width: 0; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 920px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
.head p { color: var(--muted); max-width: 62ch; }

.subj-pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { border: 1px solid var(--line); background: var(--surface); padding: 6px 14px; border-radius: 999px; font-weight: 600; font-size: .92rem; }
.pill[aria-pressed="true"] { border-color: var(--subj, var(--accent)); color: var(--surface); background: var(--subj, var(--accent)); }
.pill.maths { --subj: var(--maths); } .pill.science { --subj: var(--science); } .pill.english { --subj: var(--english); } .pill.sanskrit { --subj: var(--sanskrit); } .pill.social { --subj: var(--social); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; min-width: 0; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; font-weight: 600; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.hot { background: var(--hot); border-color: var(--hot); color: #fff; }
.btn.small { padding: 4px 10px; font-size: .88rem; }
.btn.ghost { border-color: transparent; background: none; color: var(--accent); padding-inline: 6px; }
.btn:disabled { opacity: .5; cursor: default; }

.tag { display: inline-flex; align-items: center; gap: 4px; font-size: .75rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.tag.hot { background: var(--hot-soft); color: var(--hot); }
.tag.good { background: var(--good-soft); color: var(--good); }
.tag.bad { background: var(--bad-soft); color: var(--bad); }
.tag.marks { background: var(--paper); color: var(--ink); border: 1px solid var(--line); font-family: var(--mono); }

.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.bar.good > i { background: var(--good); } .bar.warn > i { background: var(--warn); } .bar.bad > i { background: var(--bad); }

/* Dashboard */
.count { display: flex; align-items: baseline; gap: 10px; }
.count b { font-family: var(--display); font-size: 3.2rem; line-height: 1; color: var(--accent); }
.stat b { font-family: var(--mono); font-size: 1.6rem; display: block; }
.today { border-left: 4px solid var(--accent); }

/* Topics */
.ch-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.ch-btn { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.ch-btn:hover { border-color: var(--accent); }
.ch-btn .n { font-family: var(--mono); font-size: .78rem; color: var(--muted); }
.ch-btn b { font-weight: 700; }
.group-title { margin-top: 6px; }
.notes ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.formula { font-family: var(--mono); font-size: .92rem; background: var(--accent-soft); color: var(--ink); padding: 8px 12px; border-radius: 8px; overflow-x: auto; }
.solution { white-space: pre-wrap; font-size: .97rem; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.callout { padding: 10px 14px; border-radius: 8px; font-size: .95rem; }
.callout.warn { background: var(--bad-soft); }
.callout.tip { background: var(--good-soft); }

details > summary { cursor: pointer; font-weight: 600; color: var(--accent); list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "+ "; font-family: var(--mono); }
details[open] > summary::before { content: "− "; }
details[open] > summary { margin-bottom: 8px; }

.q-card { display: flex; flex-direction: column; gap: 10px; }
.q-card .q { font-weight: 600; white-space: pre-line; }
.points { width: 100%; border-collapse: collapse; font-size: .92rem; }
.points td { padding: 6px 8px; border-top: 1px solid var(--line); }
.points td:last-child { text-align: right; font-family: var(--mono); white-space: nowrap; }
.table-wrap { overflow-x: auto; }

.years { display: flex; gap: 8px; flex-wrap: wrap; }
.year { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; background: var(--surface); text-decoration: none; color: var(--ink); display: flex; flex-direction: column; min-width: 92px; }
.year b { font-family: var(--mono); font-size: 1.05rem; }
.year span { font-size: .78rem; color: var(--muted); }
.year:hover { border-color: var(--accent); }

.hot-card { border-left: 4px solid var(--hot); }

/* Tests */
.test-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.timer { font-family: var(--mono); font-size: 1.4rem; }
.timer.low { color: var(--bad); }
.opts { display: grid; gap: 8px; }
.opt { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; cursor: pointer; background: var(--surface); }
.opt input { margin-top: 5px; accent-color: var(--accent); }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.qnum { font-family: var(--mono); color: var(--muted); font-size: .85rem; }
textarea { width: 100%; min-height: 120px; font: inherit; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
select { max-width: 100%; }
select, input[type="date"] { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.score-big { font-family: var(--display); font-size: 3rem; font-weight: 700; line-height: 1; }
.confirm { background: var(--hot-soft); border-radius: 8px; padding: 10px 14px; }

/* Plan */
.week { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.week > summary { padding: 12px 16px; color: var(--ink); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.week > summary::before { color: var(--muted); }
.week[open] > summary { border-bottom: 1px solid var(--line); margin: 0; }
.week.current { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.week .wk { font-family: var(--mono); font-size: .85rem; color: var(--muted); }
.week .body { padding: 12px 16px 16px; display: grid; gap: 14px 24px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.task { display: flex; gap: 8px; align-items: flex-start; font-size: .94rem; padding: 4px 0; }
.task input { margin-top: 5px; accent-color: var(--good); flex: none; }
.task.done span { color: var(--muted); text-decoration: line-through; }
.task .go { margin-left: auto; flex: none; }
.subj-h { font-weight: 700; font-size: .85rem; letter-spacing: .04em; text-transform: uppercase; }
.subj-h.maths { color: var(--maths); } .subj-h.science { color: var(--science); } .subj-h.english { color: var(--english); } .subj-h.sanskrit { color: var(--sanskrit); } .subj-h.social { color: var(--social); }

.hist td, .hist th { padding: 8px 10px; border-top: 1px solid var(--line); text-align: left; font-size: .92rem; }
.hist th { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border-top: 0; }
.hist { width: 100%; border-collapse: collapse; }
.hist td.num { text-align: right; white-space: nowrap; }
@media (max-width: 560px) { .hist.full th:nth-child(4), .hist.full td:nth-child(4) { display: none; } .hist td, .hist th { padding: 8px 5px; font-size: .85rem; } .hist.full .pc { display: none; } }

@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; }
  .rail { position: sticky; top: env(safe-area-inset-top, 0px); height: auto; flex-direction: row; align-items: center; padding: 10px 0; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); gap: 12px; z-index: 10; overflow-x: auto; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--rail); }
  .brand small, .rail-foot, .nav-sep { display: none; }
  .brand { display: none; }
  .nav { flex-direction: row; }
  .nav button { white-space: nowrap; padding: 7px 10px; }
  .nav .dot { display: none; }
  .g2, .g3, .week .body { grid-template-columns: 1fr; }
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .test-bar { top: calc(env(safe-area-inset-top, 0px) + 56px); }
  h1 { font-size: 1.5rem; }
}
@media (prefers-reduced-motion: no-preference) { .bar > i { transition: width .4s ease; } }
</style>

<div class="app">
  <aside class="rail">
    <div class="brand">CoachYourWard<small>CBSE Class 10 · 2026–27 syllabus</small></div>
    <nav class="nav" id="nav">
      <button data-page="home"><span class="dot"></span>Dashboard</button>
      <button data-page="plan"><span class="dot"></span>Study Plan</button>
      <button data-page="topics"><span class="dot"></span>Topics</button>
      <button data-page="papers"><span class="dot"></span>Past Papers</button>
      <button data-page="hot"><span class="dot"></span>Hot Section</button>
      <button data-page="tests"><span class="dot"></span>Timed Tests</button>
      <button data-page="revise"><span class="dot"></span>Revision</button>
      <button data-page="progress"><span class="dot"></span>Progress</button>
      <div class="nav-sep"></div>
      <button data-page="jee"><span class="dot"></span>JEE Foundation</button>
    </nav>
    <div class="rail-foot">Progress is saved on this device.</div>
  </aside>
  <main class="main"><div class="wrap" id="view"></div></main>
</div>
