// Trusted Web Activity: the app opens https://study.rekhank.app full screen in Chrome, so Google sign-in,
// offline mode and progress sync work exactly as on the website.
plugins {
    id "com.android.application"
}

android {
    namespace "app.rekhank.study"
    compileSdk 36

    defaultConfig {
        applicationId "app.rekhank.study"
        minSdk 24
        targetSdk 36
        // Each CI build gets a higher version code, as the Play Store requires.
        versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1") as int)
        versionName "1.0." + (System.getenv("GITHUB_RUN_NUMBER") ?: "1")
    }

    // The signing key lives in the repository so every build can update the installed app.
    // For the Play Store it is only the upload key: Google Play App Signing holds the key users' devices see.
    signingConfigs {
        release {
            storeFile file("../coachyourward.keystore")
            storePassword "coachyourward"
            keyAlias "coachyourward"
            keyPassword "coachyourward"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.5.0"
}
